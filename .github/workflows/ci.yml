name: CI

on:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - master
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      web: ${{ steps.filter.outputs.web }}
      subgraph: ${{ steps.filter.outputs.subgraph }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - "package.json"
              - "yarn.lock"
              - ".nvmrc"
              - ".github/workflows/ci.yml"
              - ".github/actions/**"
              - "scripts/ci-prepare.sh"
              - "eslint-config/**"
              - "prettier-config/**"
              - "tsconfig/**"
            js:
              - *shared
              - "contracts/**"
              - "kleros-sdk/**"
              - "kleros-app/**"
              - "web/**"
            web:
              - *shared
              - "contracts/deployments/**"
              - "contracts/src/**"
              - "kleros-sdk/src/**"
              - "kleros-app/src/**"
              - "web/**"
            subgraph:
              - *shared
              - "contracts/deployments/**"
              - "subgraph/**"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: yarn format:check

  checks:
    name: types, lint, unit tests
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Generate code (contracts, kleros-app, web codegen)
        run: yarn ci:prepare devnet
      # web-devtools is excluded: its Ruler page only type-checks against mainnet codegen.
      - name: Type check
        run: yarn workspaces foreach -Apv --exclude kleros-v2 --exclude @kleros/kleros-v2-web-devtools run check-types
      - name: Lint
        run: yarn workspaces foreach -Apv --exclude kleros-v2 --exclude @kleros/kleros-v2-web-devtools run check-style
      - name: Unit tests with coverage thresholds
        run: yarn workspaces foreach -Apv --include @kleros/kleros-sdk --include @kleros/kleros-app --include @kleros/kleros-v2-web run test:coverage
        env:
          CI: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: unit-test-results
          path: |
            */test-results/
            */coverage/
          retention-days: 7

  web-e2e:
    name: web e2e (mocked)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Generate code
        run: yarn ci:prepare devnet
      - name: Install Playwright browser
        run: yarn workspace @kleros/kleros-v2-web exec playwright install --with-deps chromium
      - name: Playwright
        run: yarn workspace @kleros/kleros-v2-web test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  subgraph:
    needs: changes
    if: needs.changes.outputs.subgraph == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - name: Build and test (matchstick)
        run: yarn workspace @kleros/kleros-v2-subgraph test
