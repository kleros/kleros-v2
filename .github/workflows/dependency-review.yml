# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on:
  merge_group:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.deps.dev:443
            github.com:443
            pipelinesghubeus2.actions.githubusercontent.com:443
            acghubeus1.actions.githubusercontent.com:443

      - name: 'Checkout Repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          base-ref: ${{ github.event.pull_request.base.sha || 'dev' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # GHSA-fvhg-p4hf-79x3 (CVE-2026-30691): @cyntler/react-doc-viewer TXTRenderer "XSS".
          # Transitive via @kleros/ui-components-library; every published version (<= 1.17.1) is
          # in the advisory range and no patched release exists. Assessed as not exploitable here:
          # TXTRenderer renders the file text as a React child (escaped, never innerHTML), and the
          # library's own markdown renderer claims text/plain with a higher weight, so TXTRenderer
          # is never selected. Verified in Chromium with a <script>/<img onerror> .txt payload:
          # rendered as literal text, nothing injected. The upstream report
          # (cyntler/react-doc-viewer#317) has no maintainer response; its only reply also failed
          # to reproduce it. Re-check when the library changes its renderer list.
          allow-ghsas: GHSA-fvhg-p4hf-79x3
